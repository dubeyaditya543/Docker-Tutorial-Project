services:
  frontend:
    image: meetdubeyaditya/task-manager-frontend:1.0
    container_name: task-manager-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend: 
      #context tells compose file to build backend image from backend folder
    image: meetdubeyaditya/task-manager-backend:1.0
    container_name: task-manager-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
        

  postgres:
    image: postgres:17
    container_name: task-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  postgres_data: